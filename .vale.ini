# Prose linting for AI writing tells.
#
#   just lint
#
# Two rulesets, both deterministic and both readable -- no model is called and
# every hit traces to a named rule you can go and read:
#
#   signs-of-ai-writing  implements Wikipedia's WP:AICATCHPHRASE guidance
#   Deslop               stock vocabulary, hollow transitions, "not just X but Y"
#   Deck                 one local rule for a tell the other two miss
#
# `just lint-baseline` runs the same rulesets over the author's earlier decks.
# That number is the one that matters: a rate is only meaningful against the
# prose it is supposed to sound like, and both shipped rulesets fire on ordinary
# writing at a low background rate.
#
# Vale cannot parse Typst, so `just lint` extracts the deck's prose first:
# out/lint/slides.md is the rendered slide text out of the PDF, and
# out/lint/notes.md is the `// SAY:` speaker script out of main.typ. They are
# linted separately because they are different registers -- the slides are
# fragments and the notes are speech.

StylesPath = .vale-styles

Packages = https://github.com/ammil-industries/vale-signs-of-ai-writing/releases/latest/download/signs-of-ai-writing.zip, https://github.com/JMill/deslop/releases/latest/download/Deslop.zip

MinAlertLevel = suggestion

[*.md]
BasedOnStyles = signs-of-ai-writing, Deslop, Deck
